apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The bare-metal Cluster and addons pointed at the vultr-bare-metal-cp class;
# the ClusterClass is published separately from ./clusterclass.
resources:
- ../bare-metal
patches:
- path: cluster-template-patch.yaml
  target:
    group: cluster.x-k8s.io
    version: v1beta2
    kind: Cluster
