apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ClusterClass vultr-bare-metal and the templates it references. Published as
# clusterclass-vultr-bare-metal.yaml; clusterctl adds it to the generated
# cluster when the class is not installed yet.
resources:
- ../../../base
- vultr-bare-metal-worker-machine.yaml
- vultr-bare-metal-worker.yaml
patches:
- path: clusterclass-patch.yaml
  target:
    group: cluster.x-k8s.io
    version: v1beta2
    kind: ClusterClass
    name: vultr
