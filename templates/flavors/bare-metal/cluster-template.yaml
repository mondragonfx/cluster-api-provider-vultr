apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    cni: ${CLUSTER_NAME}-cilium
    ccm: ${CLUSTER_NAME}-vultr
spec:
  topology:
    classRef:
      name: vultr-bare-metal
    version: ${KUBERNETES_VERSION:=v1.32.4}
    controlPlane:
      replicas: ${CONTROL_PLANE_MACHINE_COUNT:=1}
    workers:
      machineDeployments:
      - class: default-worker
        name: md-0
        replicas: ${WORKER_MACHINE_COUNT:=0}
      - class: bare-metal-worker
        name: bm-0
        replicas: ${BARE_METAL_WORKER_MACHINE_COUNT:=1}
    variables:
    # Keep the control plane plan first: the bare-metal-cp flavor replaces slot 0.
    - name: CONTROL_PLANE_PLAN_ID
      value: ${CONTROL_PLANE_PLAN_ID}
    - name: REGION
      value: ${REGION}
    - name: WORKER_PLAN_ID
      value: ${WORKER_PLAN_ID}
    - name: BARE_METAL_PLAN_ID
      value: ${BARE_METAL_PLAN_ID}
    - name: BARE_METAL_OS_ID
      value: ${BARE_METAL_OS_ID:=2284}
    # Optional, default to "" in the ClusterClass. Without a VPC every node talks
    # over its public IP. VPC networking is opt-in and puts every node, cloud and
    # bare metal, in the VPC; not every bare metal plan supports it.
    # - name: VPC_ID
    #   value: <vpc id>
    - name: MACHINE_IMAGE
      value: ${MACHINE_IMAGE}
    - name: SSH_KEY_ID
      value: ${SSH_KEY_ID}
    - name: CLUSTER_CIDR
      value: ${CLUSTER_CIDR:=172.25.0.0/16}
    - name: SERVICE_CIDR
      value: ${SERVICE_CIDR:=172.26.0.0/16}
