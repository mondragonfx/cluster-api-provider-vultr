apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ../../addons/helm
- ../../addons/vultr-ccm
- vultr-bare-metal-worker-machine.yaml
- vultr-bare-metal-worker.yaml
- cluster-template.yaml
patches:
- path: clusterclass-patch.yaml
  target:
    group: cluster.x-k8s.io
    version: v1beta2
    kind: ClusterClass
    name: vultr
